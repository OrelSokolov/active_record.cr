---
rooms:
  columns:
  - name: id
    type: int8
    nullable: 'NO'
    default:
  - name: name
    type: text
    nullable: 'NO'
    default:
  - name: kind
    type: varchar
    nullable: 'NO'
    default: '''open'''
  - name: settings
    type: json
    nullable: 'YES'
    default:
  - name: involvement
    type: varchar
    nullable: 'YES'
    default: '''mentions'''
  - name: archived
    type: bool
    nullable: 'NO'
    default: '0'
  - name: created_at
    type: timestamp
    nullable: 'YES'
    default:
  - name: updated_at
    type: timestamp
    nullable: 'YES'
    default:
  # indexes are consumed by admin/CRUD tooling, NOT by attribute codegen —
  # this key proves the codegen ignores it (backward compatibility)
  indexes:
  - name: index_rooms_on_name
    columns:
    - name
    unique: false
    where:
messages:
  columns:
  - name: id
    type: int8
    nullable: 'NO'
    default:
  - name: room_id
    type: int4
    nullable: 'NO'
    default:
  - name: body
    type: text
    nullable: 'NO'
    default:
  - name: client_message_id
    type: varchar
    nullable: 'YES'
    default:
  - name: pinned
    type: bool
    nullable: 'NO'
    default: '0'
  - name: created_at
    type: timestamp
    nullable: 'YES'
    default:
  - name: updated_at
    type: timestamp
    nullable: 'YES'
    default:
